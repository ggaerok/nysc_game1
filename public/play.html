<title>Cosmos Ball</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#3b2a8a;color:#1b1330;
  font-family:'Jua',-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.screen{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:24px}
#cover{background:#fff;z-index:9000;color:#b8b8b8;font-size:13px}
#lobby{background:
  radial-gradient(circle at 12% 18%,#ffe9a8 0 2px,transparent 3px),radial-gradient(circle at 80% 12%,#ffe9a8 0 2px,transparent 3px),
  radial-gradient(circle at 30% 70%,#ffe9a8 0 1.5px,transparent 2.5px),radial-gradient(circle at 90% 80%,#ffe9a8 0 2px,transparent 3px),
  radial-gradient(circle at 55% 40%,#ffe9a8 0 1.5px,transparent 2.5px),radial-gradient(120% 80% at 50% 0%,#5b43c4 0%,#3b2a8a 55%,#261a63 100%);}
.card{background:#fff3cf;border:3.5px solid #1b1330;border-radius:24px;box-shadow:0 6px 0 #1b1330;padding:30px 28px 28px;max-width:340px;width:100%}
.planets{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin-bottom:12px}
.planets i{display:block;border-radius:50%;border:3px solid #1b1330}
h1{margin:0;font-size:0;line-height:0}
.logo{display:block;height:auto}
.logo.lg{width:min(280px,100%);margin:0 auto}
.logo.cv{width:min(240px,64vw);margin-bottom:16px}
.note{color:#4a3b78;font-size:min(16px,calc((100vw - 111px) / 12.8));line-height:1.55;margin:10px 0 0}
.note span{display:block;white-space:nowrap}   /* 항상 3줄: 공간이 모자라면 글자 크기를 줄인다 */
.btn{white-space:nowrap;display:inline-block;font:inherit;font-size:22px;border:3.5px solid #1b1330;border-radius:18px;padding:12px 34px;
  background:#ffd23f;color:#1b1330;text-decoration:none;margin-top:20px;box-shadow:0 4px 0 #1b1330}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1b1330}
</style>
</head>

<script>
(function () {
'use strict';
var cover = document.getElementById('cover'), coverMsg = document.getElementById('coverMsg'), lobby = document.getElementById('lobby');
var POLL = Math.max(500, parseInt(new URLSearchParams(location.search).get('poll') || '3000', 10) || 3000);
var MAX_FAILS = 2, fails = 0;
document.getElementById('enter').href = '/game' + location.search;

function render(open, msg) {
  if (open) { cover.classList.add('hidden'); lobby.classList.remove('hidden'); }
  else { cover.classList.remove('hidden'); lobby.classList.add('hidden'); coverMsg.textContent = msg || ''; }
}
function check() {
  fetch('/api/status', { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }).then(function (s) {
    fails = 0;
    if (s && s.open === true) render(true); else render(false, '현재 운영 중이 아닙니다');
  }).then(null, function () {
    fails++;
    if (fails >= MAX_FAILS) render(false, '연결할 수 없습니다');
  });
}
check();
setInterval(check, POLL);
document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
})();
</script>
