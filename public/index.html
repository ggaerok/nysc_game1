<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#3b2a8a">
<title>운영 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#3b2a8a;color:#1b1330;
  font-family:'Jua',-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 16px 40px;
  background:
  radial-gradient(circle at 12% 18%,#ffe9a8 0 2px,transparent 3px),radial-gradient(circle at 80% 12%,#ffe9a8 0 2px,transparent 3px),
  radial-gradient(circle at 30% 70%,#ffe9a8 0 1.5px,transparent 2.5px),radial-gradient(circle at 90% 80%,#ffe9a8 0 2px,transparent 3px),
  radial-gradient(circle at 55% 40%,#ffe9a8 0 1.5px,transparent 2.5px),radial-gradient(120% 80% at 50% 0%,#5b43c4 0%,#3b2a8a 55%,#261a63 100%)}
h1{margin:0 0 6px;font-size:30px;font-weight:400;color:#fff3cf;text-shadow:0 3px 0 #1b1330}
h2{margin:0 0 8px;font-size:20px;font-weight:400}
.card{background:#fff3cf;border:3.5px solid #1b1330;border-radius:24px;box-shadow:0 6px 0 #1b1330;padding:18px 20px 20px;width:100%;max-width:400px;margin-top:16px}
.note{color:#4a3b78;font-size:15px;line-height:1.5;margin:6px 0}
.top-note{color:#e6dcff;font-size:14px;line-height:1.5;max-width:360px;margin:6px 0}
.pill{display:inline-block;padding:5px 20px;border:3px solid #1b1330;border-radius:999px;font-size:18px;margin:6px 0 4px}
.pill.on{background:#7be0a4;color:#1b1330}
.pill.off{background:#fff;color:#4a3b78}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.btn{font:inherit;font-size:19px;border:3.5px solid #1b1330;border-radius:18px;padding:11px 24px;cursor:pointer;min-width:140px;
  text-decoration:none;display:inline-block;color:#1b1330;box-shadow:0 4px 0 #1b1330}
.btn.go{background:#ffd23f}
.btn.stop{background:#ff7a7a}
.btn.sub{background:#fff}
.btn.danger{background:#fff;color:#c0322e;font-size:16px;padding:9px 20px;min-width:0}
.btn:disabled{opacity:.4;cursor:default;box-shadow:0 2px 0 #1b1330}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #1b1330}
input{font:inherit;font-size:18px;padding:10px 14px;border-radius:14px;border:3.5px solid #1b1330;background:#fff;color:#1b1330;width:100%;max-width:280px;text-align:center}
input:disabled{opacity:.55}
label.f{display:block;font-size:15px;color:#4a3b78;margin:10px 0 6px}
code{background:#fff;border:2.5px solid #1b1330;border-radius:10px;padding:4px 8px;font-size:13px;word-break:break-all;user-select:all;font-family:inherit}
.err{color:#c0322e}
.hidden{display:none!important}
.sec{margin-top:22px;padding-top:16px;border-top:3px dashed #1b1330}
ol.hall{list-style:none;margin:8px 0;padding:0;text-align:left}
ol.hall li{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:2px dashed rgba(27,19,48,.35);font-size:17px}
ol.hall .rk{flex:none;width:28px;text-align:center;color:#4a3b78}
ol.hall li:first-child .rk{color:#e08a00}
ol.hall .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.hall .nm small{display:block;font-size:12px;color:#6b5c9a}
ol.hall li.live .nm small{color:#1f8a52}
ol.hall .pt{flex:none;font-variant-numeric:tabular-nums}
.empty{color:#6b5c9a;font-size:15px;padding:14px 0}
#mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(27,19,48,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
#dlg{background:#fff3cf;border:3.5px solid #1b1330;border-radius:24px;box-shadow:0 6px 0 #1b1330;padding:22px 24px;max-width:340px;width:100%}
#dlg p{margin:6px 0 0;font-size:15px;line-height:1.55;color:#4a3b78}
#dlg .row{margin:18px 0 0}
#dlg .btn{min-width:0;flex:1;padding:10px 0;font-size:18px}
</style>
</head>
<body>
<h1>운영 관리</h1>
<p class="top-note">이 주소는 참가자에게 공유하지 마세요. 참가자에게는 아래의 게임 페이지 주소만 알려 주세요.</p>
<div class="card">
<div id="pill" class="pill off">확인 중…</div>
<p id="cur" class="note"></p>

<label class="f" for="group">단체명</label>
<input id="group" type="text" maxlength="20" placeholder="예: 영업1팀" autocomplete="off">
<div id="keyRow" class="hidden"><label class="f" for="key">관리 키</label><input id="key" type="password" placeholder="관리 키" autocomplete="off"></div>
<div class="row">
  <button id="btnStart" class="btn go" type="button" disabled>운영 시작</button>
  <button id="btnStop" class="btn stop" type="button" disabled>운영 종료</button>
</div>
<p id="msg" class="note"></p>
<p class="note">게임 페이지 주소<br><code id="playUrl"></code></p>
<div class="row"><a id="preview" class="btn sub" href="/play" target="_blank" rel="noopener">게임 페이지 보기</a></div>
</div>

<div class="card">
  <h2>역대 최고기록 (상위 10)</h2>
  <div id="hallBody"><div class="empty">불러오는 중…</div></div>
  <div class="row"><button id="btnClear" class="btn danger" type="button" disabled>역대기록 지우기</button></div>
</div>

<div id="mask" class="hidden"><div id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">
  <h2 id="dlgT">역대기록 지우기</h2>
  <p>역대 최고기록 전체를 삭제합니다. 삭제한 기록은 되돌릴 수 없습니다.<br>진행 중인 운영의 기록은 점수가 다시 오를 때부터 쌓입니다.</p>
  <div class="row"><button id="dlgNo" class="btn sub" type="button">취소</button><button id="dlgYes" class="btn stop" type="button">삭제</button></div>
</div></div>

<script>
(function () {
'use strict';
function $(id) { return document.getElementById(id); }
var pill = $('pill'), cur = $('cur'), msg = $('msg'), btnStart = $('btnStart'), btnStop = $('btnStop'), btnClear = $('btnClear');
var keyRow = $('keyRow'), keyEl = $('key'), groupEl = $('group'), hallBody = $('hallBody'), mask = $('mask');
var st = { open: false, changedAt: 0, group: '', best: 0, loaded: false, error: '' }, writing = false, note = '', noteIsErr = false;
var hall = null, hallError = false, groupTouched = false;
var POLL = Math.max(500, parseInt(new URLSearchParams(location.search).get('poll') || '5000', 10) || 5000);

$('playUrl').textContent = location.origin + '/play';
try { keyEl.value = sessionStorage.getItem('adminKey') || ''; } catch (e) {}
keyEl.addEventListener('input', function () { try { sessionStorage.setItem('adminKey', keyEl.value); } catch (e) {} });
groupEl.addEventListener('input', function () { groupTouched = true; render(); });

function p2(n) { return (n < 10 ? '0' : '') + n; }
function fmt(ts) { var d = new Date(ts); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()); }
function errText(code) {
  if (code === 'storage_not_configured') return '저장소가 연결되지 않았습니다. README의 저장소 연결 단계를 확인해 주세요.';
  if (code === 'unauthorized') return '관리 키가 올바르지 않습니다.';
  if (code === 'group_required') return '단체명을 입력해 주세요.';
  if (code === 'already_open') return '이미 운영 중입니다.';
  return '서버와 통신하지 못했습니다. (' + code + ')';
}
function render() {
  pill.className = 'pill ' + (st.loaded && st.open ? 'on' : 'off');
  pill.textContent = !st.loaded ? (st.error ? '확인 불가' : '확인 중…') : (st.open ? '운영 중' : '운영 종료');
  cur.textContent = st.loaded && st.open ? '단체: ' + st.group + ' · 이번 최고 ' + st.best : '';
  var ready = st.loaded && !writing;
  var hasGroup = groupEl.value.replace(/\s+/g, '').length > 0;
  groupEl.disabled = st.loaded && st.open;
  btnStart.disabled = !ready || st.open || !hasGroup;
  btnStop.disabled = !ready || !st.open;
  btnClear.disabled = !ready;
  if (note) { msg.textContent = note; msg.className = 'note' + (noteIsErr ? ' err' : ''); }
  else if (st.error) { msg.textContent = errText(st.error); msg.className = 'note err'; }
  else if (!st.loaded) { msg.textContent = ''; msg.className = 'note'; }
  else if (!st.open && !hasGroup) { msg.textContent = '단체명을 입력하면 운영을 시작할 수 있습니다.'; msg.className = 'note'; }
  else { msg.textContent = st.changedAt ? '마지막 변경: ' + fmt(st.changedAt) : '아직 운영을 시작한 적이 없습니다.'; msg.className = 'note'; }
  renderHall();
}
function renderHall() {
  hallBody.textContent = '';
  if (hallError) { var e1 = document.createElement('div'); e1.className = 'empty err'; e1.textContent = '기록을 불러오지 못했습니다.'; hallBody.appendChild(e1); return; }
  if (hall === null) { var e0 = document.createElement('div'); e0.className = 'empty'; e0.textContent = '불러오는 중…'; hallBody.appendChild(e0); return; }
  if (!hall.length) { var e2 = document.createElement('div'); e2.className = 'empty'; e2.textContent = '아직 기록이 없습니다.'; hallBody.appendChild(e2); return; }
  var ol = document.createElement('ol'); ol.className = 'hall';
  hall.forEach(function (e, i) {
    var li = document.createElement('li'); if (e.live) li.className = 'live';
    var rk = document.createElement('span'); rk.className = 'rk'; rk.textContent = String(i + 1);
    var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = e.name;
    var sm = document.createElement('small'); sm.textContent = e.live ? '진행 중' : fmt(e.at); nm.appendChild(sm);
    var pt = document.createElement('span'); pt.className = 'pt'; pt.textContent = String(e.score);
    li.appendChild(rk); li.appendChild(nm); li.appendChild(pt); ol.appendChild(li);
  });
  hallBody.appendChild(ol);
}
function apply(j) {
  st.loaded = true; st.error = ''; st.open = j.open === true; st.changedAt = j.changedAt || 0; st.group = j.group || ''; st.best = j.best || 0;
  if (j.keyRequired) keyRow.classList.remove('hidden'); else keyRow.classList.add('hidden');
  if (st.open) groupEl.value = st.group;
  else if (!groupTouched && st.group && !groupEl.value) groupEl.value = st.group;   // 지난 단체명을 미리 채워 준다
}
function jsonOf(r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); }
function loadHall() {
  fetch('/api/hall', { cache: 'no-store' }).then(jsonOf).then(function (x) {
    if (x.ok) { hall = x.j.entries || []; hallError = false; } else { hallError = true; }
    renderHall();
  }).then(null, function () { hallError = true; renderHall(); });
}
function load() {
  if (writing) return;
  fetch('/api/status', { cache: 'no-store' }).then(jsonOf).then(function (x) {
    if (!x.ok) { st.loaded = false; st.error = (x.j && x.j.error) || 'error'; if (x.j && x.j.keyRequired) keyRow.classList.remove('hidden'); }
    else apply(x.j);
    render();
  }).then(null, function () { st.loaded = false; st.error = 'network'; render(); });
  loadHall();
}
function post(url, body, done) {
  writing = true; note = ''; noteIsErr = false; render();
  fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(jsonOf)
    .then(function (x) { done(x); }, function () { note = errText('network'); noteIsErr = true; })
    .then(function () { writing = false; render(); loadHall(); });
}
function setOpen(v) {
  if (writing) return;
  post('/api/status', { open: v, group: groupEl.value, key: keyEl.value }, function (x) {
    if (x.ok) {
      apply(x.j);
      if (v && x.j.resumed) { note = '이미 있는 단체명이라 기존 기록(' + x.j.best + '점)을 이어서 사용합니다.'; noteIsErr = false; }
    } else { note = errText((x.j && x.j.error) || 'error'); noteIsErr = true; }
  });
}
btnStart.addEventListener('click', function () { setOpen(true); });
btnStop.addEventListener('click', function () { setOpen(false); });

/* 역대기록 지우기: 확인 팝업 */
function closeDlg() { mask.classList.add('hidden'); btnClear.focus(); }
btnClear.addEventListener('click', function () { mask.classList.remove('hidden'); $('dlgNo').focus(); });
$('dlgNo').addEventListener('click', closeDlg);
mask.addEventListener('click', function (e) { if (e.target === mask) closeDlg(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !mask.classList.contains('hidden')) closeDlg(); });
$('dlgYes').addEventListener('click', function () {
  mask.classList.add('hidden');
  post('/api/hall', { clear: true, key: keyEl.value }, function (x) {
    if (x.ok) { hall = []; note = '역대 기록을 모두 지웠습니다.'; noteIsErr = false; }
    else { note = errText((x.j && x.j.error) || 'error'); noteIsErr = true; }
  });
});

render(); load(); setInterval(load, POLL);
})();
</script>
</body>
</html>
