<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>우주 합치기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#3b2a8a;color:#1b1330;
  font-family:'Jua',-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;
  background:
    radial-gradient(circle at 46% 2.5%,#ffe9a8 0 1.6px,transparent 2.4px),radial-gradient(circle at 92% 9%,#ffe9a8 0 1.2px,transparent 2px),
    radial-gradient(circle at 70% 3%,#ffe9a8 0 1px,transparent 1.8px),radial-gradient(circle at 25% 12%,#ffe9a8 0 1px,transparent 1.8px),
    linear-gradient(180deg,#3b2a8a 0%,#5a3aa8 55%,#7a4cc0 100%)}
#hud{width:100%;max-width:520px;display:flex;flex-direction:column;gap:6px;
  padding:6px 12px 2px;padding-top:calc(6px + env(safe-area-inset-top,0px))}
#topline{display:flex;align-items:center;gap:8px;min-height:38px}
#org{flex:1;min-width:0;font-size:19px;color:#ffe9a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 2px 0 #1b1330}
#bar{display:flex;align-items:stretch;gap:6px;height:56px}
.box{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;
  background:#fff3cf;border:3.5px solid #1b1330;border-radius:18px;box-shadow:0 4px 0 #1b1330;padding:0 6px}
.box .lab{font-size:11px;color:#6b5a9c;line-height:1.1}
.box b{font-size:23px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;color:#1b1330}
.box.best b{color:#e63950}
.box.next{flex:none;width:58px}
.box.next canvas{width:30px;height:30px;margin-top:1px}
.ib{flex:none;width:48px;border:3.5px solid #1b1330;border-radius:18px;background:#ffd23f;box-shadow:0 4px 0 #1b1330;
  display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 #1b1330}
.ib svg{display:block;stroke:#1b1330}
#btnHall{font:inherit;font-size:14px;color:#1b1330;background:#ffd23f;border:3.5px solid #1b1330;border-radius:18px;box-shadow:0 4px 0 #1b1330;
  height:38px;padding:0 13px;display:flex;align-items:center;gap:6px;cursor:pointer;flex:none}
#btnHall:active{transform:translateY(3px);box-shadow:0 1px 0 #1b1330}
#btnHall svg{stroke:#1b1330}
#banner{position:absolute;left:12px;top:8px;text-align:left;color:#4a3b78;font-weight:700;font-size:min(13.5px,calc((100vw - 70px) / 22));line-height:1.45;white-space:nowrap;padding:0 2px;margin:0}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:4px 8px 6px}
#game{display:block;touch-action:none;border-radius:20px;box-shadow:0 5px 0 #1b1330}
#legcard{position:relative;flex:none;width:calc(100% - 24px);max-width:496px;padding:8px 10px 6px;margin-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  background:#fff3cf;border:3.5px solid #1b1330;border-radius:18px;box-shadow:0 4px 0 #1b1330;box-sizing:border-box}
#legend{--u:30px;width:100%;display:flex;justify-content:space-between;align-items:flex-end;padding:0 4px}
#legend .it{flex:none;width:var(--u);display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
#legend .it canvas{display:block;flex:none}
#legend .it span{margin-top:2px;font-size:calc(var(--u) / 3.5);line-height:1.1;color:#1b1330;white-space:nowrap;letter-spacing:-.04em}
#over,#dlg{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(27,19,48,.72);z-index:8;padding:16px}
#over{z-index:5}
#over.hidden,#dlg.hidden{display:none}
.card{background:#fff3cf;border:3.5px solid #1b1330;border-radius:24px;box-shadow:0 6px 0 #1b1330;padding:22px 28px;text-align:center;min-width:220px;color:#1b1330}
.card h2{margin:0 0 10px;font-size:26px;font-weight:400}
.card p{margin:4px 0;font-size:19px}
.card p.sm{font-size:15px;color:#6b5a9c}
.card button{margin-top:16px;font:inherit;font-size:19px;color:#1b1330;background:#ffd23f;border:3.5px solid #1b1330;border-radius:18px;box-shadow:0 4px 0 #1b1330;
  padding:10px 30px;cursor:pointer}
.card button:active{transform:translateY(3px);box-shadow:0 1px 0 #1b1330}
#dlg .card{width:100%;max-width:360px;min-width:0}
#dlg .row{display:flex;gap:10px;margin-top:16px}
#dlg .row button{flex:1;margin-top:0;padding:11px 0;font-size:18px}
#dlg .row button.sec{background:#fff;color:#1b1330}
#dlg ol{list-style:none;margin:6px 0 0;padding:0;text-align:left}
#dlg li{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:2px dashed #d9c68f;font-size:17px}
#dlg li:last-child{border-bottom:0}
#dlg li .rk{flex:none;width:24px;text-align:center;color:#8a74c0}
#dlg li:nth-child(1) .rk{color:#e63950}
#dlg li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dlg li .nm small{display:block;font-size:12px;color:#8a74c0}
#dlg li .pt{flex:none;font-variant-numeric:tabular-nums}
#dlg li.live .nm small{color:#1f9d55}
#dlg .empty{padding:18px 0;color:#8a74c0;font-size:15px;text-align:center}

/* ---- 운영 상태(흰 화면 덮개) ---- */
.hidden{display:none!important}
.screen{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:24px}
#cover{background:#fff;z-index:9000;color:#b8b8b8;font-size:13px}
</style>
</head>
<body>
<!-- 흰 화면 덮개: 운영 중이 확인되기 전에는 기본으로 화면 전체를 덮는다 -->
<div id="cover" class="screen hidden"><span id="coverMsg"></span></div>
<div id="app">
  <header id="hud">
    <div id="topline">
      <span id="org"></span>
      <button id="btnHall" type="button" aria-label="역대 최고기록">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffd54a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v6a4 4 0 0 1-8 0V4z"/><path d="M8 6H4v1a3 3 0 0 0 4 3M16 6h4v1a3 3 0 0 1-4 3"/><path d="M12 14v4M8 20h8"/></svg>
        <span>역대 기록</span>
      </button>
    </div>
    <div id="bar">
      <div class="box"><span class="lab">점수</span><b id="score">0</b></div>
      <div class="box best"><span class="lab">최고</span><b id="best">0</b></div>
      <div class="box next"><span class="lab">다음</span><canvas id="next" width="96" height="96"></canvas></div>
      <button class="ib" id="btnHome" type="button" aria-label="처음으로">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e8ecff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      </button>
      <button class="ib" id="btnRefresh" type="button" aria-label="새로고침 (다시 시작)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e8ecff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 6"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>
  </header>
  <main id="stage"><canvas id="game"></canvas></main>
  <div id="legcard"><div id="banner"><div>※ 천체가 합쳐져 커지는 것은 게임 속 설정입니다.</div><div>※ 천체 크기는 실제 비율과 다릅니다.</div></div>
  <footer id="legend"></footer></div>
  <div id="dlg" class="hidden"><div class="card" id="dlgCard"></div></div>
  <div id="over" class="hidden">
    <div class="card">
      <h2>게임 오버</h2>
      <p>점수 <b id="finalScore">0</b></p>
      <p class="sm">단체 최고 <span id="finalBest">0</span></p>
      <button id="restart" type="button">다시 하기</button>
    </div>
  </div>
</div>

  fetch('/api/hall', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); }).then(function (j) {
    if (!uiOpen || !elDlgCard.contains(body)) return;
    var list = (j && j.entries) || [];
    if (!list.length) { body.textContent = '아직 기록이 없습니다.'; return; }
    var ol = el('ol');
    list.forEach(function (e, i) {
      var li = el('li', e.live ? 'live' : '');
      li.appendChild(el('span', 'rk', String(i + 1)));
      var nm = el('span', 'nm', e.name); nm.appendChild(el('small', '', e.live ? '진행 중' : fmtAt(e.at)));
      li.appendChild(nm); li.appendChild(el('span', 'pt', String(e.score))); ol.appendChild(li);
    });
    body.replaceWith(ol);
  }).then(null, function () { if (elDlgCard.contains(body)) body.textContent = '기록을 불러오지 못했습니다.'; });
}
document.getElementById('btnHall').addEventListener('click', hallDlg);
document.getElementById('btnHome').addEventListener('click', function () {
  function go() { location.href = '/play' + location.search; }
  if (state === 'play' && score > 0) confirmDlg('처음으로', '처음 화면으로 돌아갑니다. 진행 중인 게임은 사라집니다.', '돌아가기', go); else go();
});
document.getElementById('btnRefresh').addEventListener('click', function () {
  if (state === 'play' && score > 0) confirmDlg('다시 시작', '지금 게임을 끝내고 처음부터 다시 시작합니다.', '다시 시작', reset); else reset();
});

/* ---------- 메인 루프 (주사율과 무관하게 60Hz 고정 시뮬레이션) ---------- */
var last = 0, acc = 0, running = false, loopToken = 0;
function tick(t) {
  if (!last) last = t;
  var dt = Math.min(100, t - last); last = t;
  if (state === 'play' && !document.hidden && !uiOpen) {
    acc += dt; var n = 0;
    while (acc >= STEP && n < 5) { stepSim(); acc -= STEP; n++; }
    if (n === 5) acc = 0;
  }
  render();
}
// 게임은 운영 중일 때 입구 스크립트가 start()를 부를 때만 돌고, 종료되면 stop()으로 멈춘다
function start() {
  if (running) return;
  running = true; reset(); last = 0; acc = 0; fit();
  var token = ++loopToken;
  function f(t) { if (!running || token !== loopToken) return; requestAnimationFrame(f); tick(t); }
  requestAnimationFrame(f);
}
function stop() {
  if (!running) return;
  running = false; pressed = false; reset(); elOver.classList.add('hidden'); closeDlg();
}
window.__game = { start: start, stop: stop, isRunning: function () { return running; },
  setInfo: function (o) {
    if (!o) return;
    if (typeof o.group === 'string') document.getElementById('org').textContent = o.group;
    if (typeof o.best === 'number') { best = o.best; showBest(); }
  } };

window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function () { setTimeout(fit, 200); });
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.getElementById('stage'));

/* 개발·검증용 훅 (주소에 ?dev=1 이 있을 때만) */
if (/[?&]dev=1/.test(location.search)) window.__spaceMerge = {
  BODIES: BODIES, sprites: sprites,
  step: function (n) { for (var i = 0; i < (n || 1); i++) stepSim(); },
  spawn: spawn, planets: planets, reset: reset,
  dropAt: function (x) { dropX = x; canDrop = true; nextDropAt = 0; return tryDrop(); },
  info: function () {
    var ps = planets(), bad = false, maxL = 0;
    ps.forEach(function (b) { if (!isFinite(b.position.x) || !isFinite(b.position.y)) bad = true; if (b.level > maxL) maxL = b.level; });
    return { count: ps.length, score: score, state: state, maxLevel: maxL, nan: bad, simTime: simTime };
  }
};
})();
</script>

<script>/* ---------- 게임 페이지 운영 상태 확인 ----------
   /game 은 서버가 '운영 중'일 때만 이 페이지를 내려준다. 이미 열려 있는 동안에도 주기적으로
   /api/status 를 확인해서, 운영이 종료되면 흰 화면으로 덮고 게임을 멈춘다.
   - 상태를 연속으로 확인하지 못하면(연결 끊김 등) 닫힘으로 본다. */
(function () {
'use strict';
function $(id) { return document.getElementById(id); }
var cover = $('cover'), coverMsg = $('coverMsg'), appEl = $('app');
var POLL = Math.max(500, parseInt(new URLSearchParams(location.search).get('poll') || '3000', 10) || 3000);
var MAX_FAILS = 3;

var open = true, fails = 0, covered = false;

function setCovered(on, msg) {
  covered = on;
  if (on) { cover.classList.remove('hidden'); appEl.classList.add('hidden'); coverMsg.textContent = msg || ''; }
  else { cover.classList.add('hidden'); appEl.classList.remove('hidden'); }
  var g = window.__game;
  if (g) { if (on) g.stop(); else g.start(); }
}

function check() {
  fetch('/api/status', { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }).then(function (s) {
    fails = 0;
    open = s && s.open === true;
    if (open && window.__game && window.__game.setInfo) window.__game.setInfo({ group: s.group || '', best: Number(s.best) || 0 });
    if (!open) { if (!covered) setCovered(true, '현재 운영 중이 아닙니다'); else coverMsg.textContent = '현재 운영 중이 아닙니다'; }
    else if (covered) { location.replace('/play' + location.search); }   // 다시 열리면 입구부터
  }).then(null, function () {
    fails++;
    if (fails >= MAX_FAILS) setCovered(true, '연결할 수 없습니다');
  });
}

setCovered(false);            // 서버가 열려 있다고 확인하고 내려준 페이지이므로 바로 시작
check();
setInterval(check, POLL);
document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
})();
</script>
</body>
