<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>우주 합치기</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05060f;color:#e8ecff;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;
  background:radial-gradient(120% 70% at 50% 0%,#121638 0%,#05060f 60%)}
#hud{width:100%;max-width:520px;display:flex;flex-direction:column;gap:6px;
  padding:6px 10px 2px;padding-top:calc(6px + env(safe-area-inset-top,0px))}
#topline{display:flex;align-items:center;gap:8px;min-height:36px}
#org{flex:1;min-width:0;font-size:15px;font-weight:800;color:#ffd54a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{display:flex;align-items:stretch;gap:6px;height:54px}
.box{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;
  background:#12163a;border-radius:12px;padding:2px 6px}
.box .lab{font-size:11px;letter-spacing:.06em;color:#9aa5e0}
.box b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.box.best b{color:#ffd54a}
.box.next{flex:none;width:54px}
.box.next canvas{width:30px;height:30px}
.ib{flex:none;width:46px;border:0;border-radius:12px;background:#2a3068;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.ib:active{transform:scale(.95)}
.ib svg{display:block}
#btnHall{font:inherit;font-size:13px;font-weight:700;color:#e8ecff;background:#2a3068;border:0;border-radius:12px;height:36px;
  padding:0 12px;display:flex;align-items:center;gap:6px;cursor:pointer;flex:none}
#btnHall:active{transform:scale(.97)}
#dlg{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;
  background:rgba(3,4,12,.78);z-index:8;padding:16px}
#dlg .card{width:100%;max-width:360px;min-width:0}
#dlg .row{display:flex;gap:10px;margin-top:16px}
#dlg .row button{flex:1;margin-top:0;padding:12px 0;font-size:16px}
#dlg .row button.sec{background:#2a3068;color:#e8ecff}
#dlg ol{list-style:none;margin:6px 0 0;padding:0;text-align:left}
#dlg li{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid #232a63;font-size:15px}
#dlg li:last-child{border-bottom:0}
#dlg li .rk{flex:none;width:22px;text-align:center;font-weight:800;color:#8f9ad6}
#dlg li:nth-child(1) .rk{color:#ffd54a}
#dlg li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dlg li .nm small{display:block;font-size:11px;color:#8f9ad6}
#dlg li .pt{flex:none;font-weight:800;font-variant-numeric:tabular-nums}
#dlg li.live .nm small{color:#7be0a4}
#dlg .empty{padding:18px 0;color:#8f9ad6;font-size:14px;text-align:center}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:0 8px}
#game{display:block;touch-action:none;border-radius:10px}
#legend{--u:min(44px,calc((100vw - 8px) / 11));width:100%;max-width:520px;display:flex;justify-content:center;
  align-items:flex-end;padding:6px 4px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
#legend .it{width:var(--u);display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
#legend .it canvas{display:block}
#legend .it span{margin-top:3px;font-size:calc(var(--u) / 3.3);line-height:1.1;color:#aab4e8;white-space:nowrap;
  letter-spacing:-.02em}
#over{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(3,4,12,.72);
  z-index:5}
#over.hidden{display:none}
.card{background:#12163a;border:1px solid #2c3470;border-radius:16px;padding:22px 30px;text-align:center;min-width:220px}
.card h2{margin:0 0 10px;font-size:24px}
.card p{margin:4px 0;font-size:18px}
.card p.sm{font-size:14px;color:#9aa5e0}
.card button{margin-top:16px;font:inherit;font-size:17px;font-weight:700;color:#05060f;background:#ffd54a;border:0;
  border-radius:999px;padding:11px 30px;cursor:pointer}
.card button:active{transform:scale(.97)}

/* ---- 운영 상태(흰 화면 덮개) ---- */
.hidden{display:none!important}
.screen{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:24px}
#cover{background:#fff;z-index:9000;color:#b8b8b8;font-size:13px}
</style>
</head>
<body>
<!-- 흰 화면 덮개: 운영 중이 확인되기 전에는 기본으로 화면 전체를 덮는다 -->
<div id="cover" class="screen hidden"><span id="coverMsg"></span></div>
<div id="app">
  <header id="hud">
    <div id="topline">
      <span id="org"></span>
      <button id="btnHall" type="button" aria-label="역대 최고기록">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffd54a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v6a4 4 0 0 1-8 0V4z"/><path d="M8 6H4v1a3 3 0 0 0 4 3M16 6h4v1a3 3 0 0 1-4 3"/><path d="M12 14v4M8 20h8"/></svg>
        <span>역대 기록</span>
      </button>
    </div>
    <div id="bar">
      <div class="box"><span class="lab">점수</span><b id="score">0</b></div>
      <div class="box best"><span class="lab">최고</span><b id="best">0</b></div>
      <div class="box next"><span class="lab">다음</span><canvas id="next" width="96" height="96"></canvas></div>
      <button class="ib" id="btnHome" type="button" aria-label="처음으로">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e8ecff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      </button>
      <button class="ib" id="btnRefresh" type="button" aria-label="새로고침 (다시 시작)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e8ecff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 6"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>
  </header>
  <main id="stage"><canvas id="game"></canvas></main>
  <footer id="legend"></footer>
  <div id="dlg" class="hidden"><div class="card" id="dlgCard"></div></div>
  <div id="over" class="hidden">
    <div class="card">
      <h2>게임 오버</h2>
      <p>점수 <b id="finalScore">0</b></p>
      <p class="sm">단체 최고 <span id="finalBest">0</span></p>
      <button id="restart" type="button">다시 하기</button>
    </div>
  </div>
</div>

<script>/*MATTER_JS*/</script>
<script>
(function () {
'use strict';

var M = window.Matter;
var Engine = M.Engine, Bodies = M.Bodies, Body = M.Body, Events = M.Events, Composite = M.Composite;

/* ---------- 상수 ---------- */
var W = 400, H = 600;          // 게임 판의 논리 좌표 크기
var DROP_Y = 44;               // 천체를 떨어뜨리는 높이
var LINE_Y = 96;               // 게임오버 판정선
var SS = 2.5;                  // 스프라이트 해상도 배율
var STEP = 1000 / 60;          // 고정 시뮬레이션 간격(ms)
var TWO_PI = Math.PI * 2;

/* ---------- 작은 도구들 ---------- */
function rng(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function circlePath(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TWO_PI); }
function blobPath(c, cx, cy, rad, rand, irreg, n) {
  n = n || 10;
  var p = [], i, a, k;
  for (i = 0; i < n; i++) {
    a = i / n * TWO_PI; k = 1 - irreg + rand() * irreg * 2;
    p.push([cx + Math.cos(a) * rad * k, cy + Math.sin(a) * rad * k]);
  }
  c.beginPath();
  c.moveTo((p[n - 1][0] + p[0][0]) / 2, (p[n - 1][1] + p[0][1]) / 2);
  for (i = 0; i < n; i++) {
    var q = p[i], b = p[(i + 1) % n];
    c.quadraticCurveTo(q[0], q[1], (q[0] + b[0]) / 2, (q[1] + b[1]) / 2);
  }
  c.closePath();
}
function craters(c, r, rand, n, minR, maxR, fill, rim) {
  for (var i = 0; i < n; i++) {
    var d = Math.sqrt(rand()) * r * 0.9, a = rand() * TWO_PI;
    var x = Math.cos(a) * d, y = Math.sin(a) * d, cr = r * (minR + rand() * (maxR - minR));
    circlePath(c, x, y, cr); c.fillStyle = fill; c.fill();
    c.strokeStyle = rim; c.lineWidth = Math.max(0.5, cr * 0.2);
    c.beginPath(); c.arc(x, y, cr, Math.PI * 0.75, Math.PI * 1.75); c.stroke();
  }
}
function band(c, r, y0, y1, color, amp, freq, phase) {
  var n = 16, i, x, y;
  c.fillStyle = color; c.beginPath();
  for (i = 0; i <= n; i++) {
    x = -r + 2 * r * i / n; y = y0 * r + Math.sin(x / r * freq + phase) * r * amp;
    if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
  }
  for (i = n; i >= 0; i--) {
    x = -r + 2 * r * i / n; y = y1 * r + Math.sin(x / r * freq + phase + 0.8) * r * amp;
    c.lineTo(x, y);
  }
  c.closePath(); c.fill();
}
function ringArc(c, rx, ry, rot, front, color, lw) {
  c.beginPath();
  c.ellipse(0, 0, rx, ry, rot, front ? 0 : Math.PI, front ? Math.PI : TWO_PI);
  c.strokeStyle = color; c.lineWidth = lw; c.stroke();
}
function ellipseFill(c, x, y, rx, ry, rot, fill) {
  c.beginPath(); c.ellipse(x, y, rx, ry, rot || 0, 0, TWO_PI); c.fillStyle = fill; c.fill();
}

/* ---------- 천체 그림 (조사한 실제 모습을 바탕으로 한 캔버스 그림) ---------- */

// 달: 옅은 회색, 어두운 바다(maria)와 밝은 고지대, 크레이터
function drawMoon(c, r) {
  var R = rng(11), g = c.createRadialGradient(-r * .25, -r * .25, r * .1, 0, 0, r);
  g.addColorStop(0, '#dcdcdc'); g.addColorStop(1, '#aaaaae');
  c.fillStyle = g; c.fillRect(-r, -r, 2 * r, 2 * r);
  c.fillStyle = 'rgba(88,90,100,.55)';
  blobPath(c, -r * .32, -r * .22, r * .34, R, .35, 10); c.fill();
  blobPath(c, r * .28, -r * .38, r * .24, R, .35, 9); c.fill();
  blobPath(c, r * .12, r * .22, r * .34, R, .35, 10); c.fill();
  blobPath(c, -r * .38, r * .42, r * .2, R, .3, 8); c.fill();
  craters(c, r, R, 16, .05, .15, 'rgba(70,70,76,.35)', 'rgba(255,255,255,.4)');
}
// 수성: 달과 비슷하지만 바다가 없고 크레이터가 더 촘촘한 어두운 회갈색
function drawMercury(c, r) {
  var R = rng(23), g = c.createRadialGradient(-r * .25, -r * .25, r * .1, 0, 0, r);
  g.addColorStop(0, '#a49b91'); g.addColorStop(1, '#6c645c');
  c.fillStyle = g; c.fillRect(-r, -r, 2 * r, 2 * r);
  c.fillStyle = 'rgba(125,100,78,.35)';
  blobPath(c, r * .3, -r * .2, r * .4, R, .25, 10); c.fill();
  craters(c, r, R, 28, .03, .11, 'rgba(55,50,46,.42)', 'rgba(255,255,255,.28)');
  c.strokeStyle = 'rgba(235,228,215,.35)'; c.lineWidth = Math.max(.5, r * .02);
  for (var i = 0; i < 8; i++) {
    var a = i / 8 * TWO_PI;
    c.beginPath(); c.moveTo(-r * .4 + Math.cos(a) * r * .06, r * .35 + Math.sin(a) * r * .06);
    c.lineTo(-r * .4 + Math.cos(a) * r * .32, r * .35 + Math.sin(a) * r * .32); c.stroke();
  }
}
// 화성: 붉은 산화철 표면, 어두운 지표 무늬, 흰 극관
function drawMars(c, r) {
  var R = rng(37), g = c.createRadialGradient(-r * .2, -r * .2, r * .1, 0, 0, r);
  g.addColorStop(0, '#d4703f'); g.addColorStop(1, '#a94a28');
  c.fillStyle = g; c.fillRect(-r, -r, 2 * r, 2 * r);
  c.fillStyle = 'rgba(235,170,120,.32)';
  blobPath(c, -r * .4, -r * .1, r * .3, R, .4, 9); c.fill();
  blobPath(c, r * .45, r * .3, r * .28, R, .4, 9); c.fill();
  c.fillStyle = 'rgba(105,45,30,.55)';
  blobPath(c, r * .1, r * .05, r * .32, R, .45, 10); c.fill();
  blobPath(c, -r * .15, r * .5, r * .22, R, .4, 9); c.fill();
  blobPath(c, r * .5, -r * .25, r * .17, R, .4, 8); c.fill();
  ellipseFill(c, 0, -r * .93, r * .42, r * .2, 0, 'rgba(250,250,252,.95)');
  ellipseFill(c, 0, r * .96, r * .28, r * .12, 0, 'rgba(250,250,252,.85)');
}
// 금성: 표면이 보이지 않는 두꺼운 구름, 노란빛 크림색 소용돌이
function drawVenus(c, r) {
  var g = c.createRadialGradient(-r * .2, -r * .2, r * .1, 0, 0, r);
  g.addColorStop(0, '#f1dba8'); g.addColorStop(1, '#d0aa66');
  c.fillStyle = g; c.fillRect(-r, -r, 2 * r, 2 * r);
  var cols = ['rgba(250,235,195,.55)', 'rgba(205,160,90,.45)', 'rgba(236,210,150,.5)', 'rgba(190,140,75,.35)'];
  c.lineCap = 'round';
  for (var k = 0; k < 13; k++) {
    var y = -r + k * (2 * r / 12), ph = k * 0.9;
    c.strokeStyle = cols[k % 4]; c.lineWidth = r * .17; c.beginPath();
    for (var i = 0; i <= 16; i++) {
      var x = -r + 2 * r * i / 16, yy = y + Math.sin(x / r * 3 + ph) * r * .08 + (x / r) * r * .12;
      if (i === 0) c.moveTo(x, yy); else c.lineTo(x, yy);
    }
    c.stroke();
  }
}
// 지구: 파란 바다, 초록·갈색 대륙, 흰 구름, 흰 극관
function drawEarth(c, r) {
  var R = rng(53), g = c.createRadialGradient(-r * .2, -r * .2, r * .1, 0, 0, r);
  g.addColorStop(0, '#3a8cf0'); g.addColorStop(1, '#14449b');
  c.fillStyle = g; c.fillRect(-r, -r, 2 * r, 2 * r);
  var land = [[-.25, -.25, .38, '#4aa84f'], [.38, .12, .3, '#5ab257'], [-.1, .52, .26, '#8fa04d'],
              [.48, -.45, .18, '#4aa84f'], [-.58, .22, .2, '#5ab257']];
  for (var i = 0; i < land.length; i++) {
    var L = land[i];
    c.fillStyle = L[3]; blobPath(c, L[0] * r, L[1] * r, L[2] * r, R, .38, 10); c.fill();
    c.fillStyle = 'rgba(160,130,70,.55)'; blobPath(c, L[0] * r + r * .04, L[1] * r + r * .03, L[2] * r * .45, R, .35, 8); c.fill();
  }
  ellipseFill(c, 0, -r * .95, r * .46, r * .18, 0, 'rgba(255,255,255,.95)');
  ellipseFill(c, 0, r * .97, r * .36, r * .14, 0, 'rgba(255,255,255,.9)');
  c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineCap = 'round';
  for (i = 0; i < 11; i++) {
    var cx = (R() * 2 - 1) * r * .75, cy = (R() * 2 - 1) * r * .75, len = r * (.18 + R() * .25);
    c.lineWidth = r * (.05 + R() * .05);
    c.beginPath(); c.moveTo(cx - len, cy); c.quadraticCurveTo(cx, cy - len * .5, cx + len, cy + len * .1); c.stroke();
  }
}
// 해왕성: 짙은 푸른색(진한 남청), 어두운 점, 흰 구름 줄무늬
function drawNeptune(c, r) {
  var R = rng(71), g = c.createRadialGradient(-r * .2, -r * .2, r * .1, 0, 0, r);
  g.addColorStop(0, '#3f6cf0'); g.addColorStop(1, '#17288a');
  c.fillStyle = g; c.fillRect(-r, -r, 2 * r, 2 * r);
  band(c, r, -.55, -.38, 'rgba(15,35,150,.28)', .03, 3, 1);
  band(c, r, -.1, .08, 'rgba(130,170,255,.2)', .03, 3, 2);
  band(c, r, .4, .58, 'rgba(15,35,150,.28)', .03, 3, 3);
  ellipseFill(c, -r * .22, r * .12, r * .24, r * .14, -.25, 'rgba(8,16,85,.82)');
  c.strokeStyle = 'rgba(235,242,255,.8)'; c.lineCap = 'round';
  c.lineWidth = r * .045;
  c.beginPath(); c.moveTo(r * .06, r * .02); c.quadraticCurveTo(r * .22, r * .0, r * .36, r * .1); c.stroke();
  for (var i = 0; i < 4; i++) {
    var x = (R() * 2 - 1) * r * .6, y = (R() * 2 - 1) * r * .6;
    c.lineWidth = r * .03; c.beginPath(); c.moveTo(x, y); c.lineTo(x + r * .2, y - r * .03); c.stroke();
  }
}
// 천왕성: 옅은 청록색(밝은 하늘색), 거의 무늬 없는 표면, 가는 고리
function drawUranus(c, r) {
  var pr = r * .86, rot = -1.15;
  ringArc(c, r * .97, r * .3, rot, false, 'rgba(205,235,240,.75)', r * .035);
  var g = c.createRadialGradient(-pr * .25, -pr * .25, pr * .1, 0, 0, pr);
  g.addColorStop(0, '#d6f8f6'); g.addColorStop(1, '#8dd6dc');
  circlePath(c, 0, 0, pr); c.fillStyle = g; c.fill();
  c.save(); circlePath(c, 0, 0, pr); c.clip();
  band(c, pr, -.2, -.05, 'rgba(255,255,255,.14)', .02, 3, 1);
  band(c, pr, .3, .42, 'rgba(110,190,200,.16)', .02, 3, 2);
  ellipseFill(c, 0, -pr * .9, pr * .6, pr * .25, 0, 'rgba(255,255,255,.22)');
  c.restore();
  ringArc(c, r * .97, r * .3, rot, true, 'rgba(215,240,244,.9)', r * .035);
}
// 토성: 연한 버터스카치색 줄무늬 + 선명한 고리(틈 포함)
function drawSaturn(c, r) {
  var pr = r * .62, rot = -.35;
  function rings(front) {
    ringArc(c, r * .72, r * .72 * .32, rot, front, 'rgba(125,105,85,.55)', r * .055);
    ringArc(c, r * .83, r * .83 * .32, rot, front, 'rgba(232,214,160,.97)', r * .12);
    ringArc(c, r * .94, r * .94 * .32, rot, front, 'rgba(190,168,122,.95)', r * .065);
  }
  rings(false);
  var g = c.createRadialGradient(-pr * .3, -pr * .3, pr * .1, 0, 0, pr);
  g.addColorStop(0, '#f1dcaa'); g.addColorStop(1, '#c8a465');
  circlePath(c, 0, 0, pr); c.fillStyle = g; c.fill();
  c.save(); circlePath(c, 0, 0, pr); c.clip();
  band(c, pr, -.7, -.5, 'rgba(190,150,90,.35)', .02, 3, 1);
  band(c, pr, -.2, .0, 'rgba(250,235,190,.4)', .02, 3, 2);
  band(c, pr, .3, .5, 'rgba(180,140,85,.35)', .02, 3, 3);
  band(c, pr, .7, .9, 'rgba(240,222,170,.3)', .02, 3, 4);
  c.restore();
  rings(true);
}
// 목성: 주황·갈색·크림색 줄무늬(belt/zone)와 대적점
function drawJupiter(c, r) {
  c.fillStyle = '#d8b98f'; c.fillRect(-r, -r, 2 * r, 2 * r);
  var B = [[-1.05, -.8, '#b88a62'], [-.8, -.62, '#e9d6b6'], [-.62, -.42, '#b4764a'], [-.42, -.26, '#eed9bc'],
           [-.26, -.08, '#a8683f'], [-.08, .1, '#ecdcc0'], [.1, .3, '#bd835a'], [.3, .45, '#efe0c8'],
           [.45, .66, '#b07448'], [.66, .82, '#e6d0ae'], [.82, 1.05, '#a97a55']];
  for (var i = 0; i < B.length; i++) band(c, r, B[i][0], B[i][1], B[i][2], .022, 4, i * 1.3);
  ellipseFill(c, r * .26, r * .38, r * .26, r * .15, 0, '#c2553a');

  ellipseFill(c, r * .27, r * .39, r * .12, r * .07, .2, '#9d3b27');

// 태양: 노란 중심에서 주황빛 가장자리로 어두워지는 림 다크닝, 쌀알 무늬, 흑점

  var R = rng(97), g = c.createRadialGradient(0, 0, 0, 0, 0, r);
  g.addColorStop(0, '#fffbd2'); g.addColorStop(.5, '#ffd84e'); g.addColorStop(.85, '#ffac22'); g.addColorStop(1, '#e8730c');
  c.fillStyle = g; c.fillRect(-r, -r, 2 * r, 2 * r);
  var i, x, y, a, d;
  for (i = 0; i < r * 3; i++) {
    d = Math.sqrt(R()) * r * .95; a = R() * TWO_PI;

  }

// 은하: 깊은 우주색 원 안에 나선팔, 푸른 바깥 팔과 붉은 노란빛 중심핵
function drawGalaxy(c, r) {
  var R = rng(131), i, k, t, rad, th, x, y;
  function gauss() { return (R() + R() + R() - 1.5) / 1.5; }
  var bg = c.createRadialGradient(0, 0, 0, 0, 0, r);
  bg.addColorStop(0, '#1d1448'); bg.addColorStop(.55, '#0b0b2e'); bg.addColorStop(1, '#04040f');
  c.fillStyle = bg; c.fillRect(-r, -r, 2 * r, 2 * r);
  for (i = 0; i < 70; i++) {
    x = (R() * 2 - 1) * r; y = (R() * 2 - 1) * r;
    circlePath(c, x, y, Math.max(.5, r * .008) * (.6 + R()));
    c.fillStyle = 'rgba(255,255,255,' + (.25 + R() * .45) + ')'; c.fill();
  }
  // 팔 전체를 감싸는 은은한 빛
  c.lineCap = 'round'; c.lineJoin = 'round';
  for (k = 0; k < 2; k++) {
    c.beginPath();
    for (i = 0; i <= 40; i++) {
      t = i / 40; rad = r * (.12 + .82 * t); th = k * Math.PI + t * 4.2;
      x = Math.cos(th) * rad; y = Math.sin(th) * rad;
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.strokeStyle = 'rgba(110,140,255,.16)'; c.lineWidth = r * .2; c.stroke();
    c.strokeStyle = 'rgba(160,190,255,.12)'; c.lineWidth = r * .09; c.stroke();
  }
  // 별 알갱이
  var dot = Math.max(.7, r / 70), N = Math.round(r * 18), col;
  for (i = 0; i < N; i++) {
    k = i % 2; t = Math.pow(R(), .75);
    rad = r * (.1 + .86 * t); th = k * Math.PI + t * 4.2 + gauss() * .4 * (1 - .45 * t);
    x = Math.cos(th) * rad; y = Math.sin(th) * rad;
    if (R() < .035) col = '255,140,190';
    else if (t < .25) col = '255,236,190';
    else if (t < .6) col = '215,226,255';
    else col = '140,176,255';
    circlePath(c, x, y, dot * (.45 + R() * .9));
    c.fillStyle = 'rgba(' + col + ',' + (.35 + R() * .55) + ')'; c.fill();
  }
  var core = c.createRadialGradient(0, 0, 0, 0, 0, r * .45);
  core.addColorStop(0, 'rgba(255,250,225,1)'); core.addColorStop(.18, 'rgba(255,226,165,.92)');
  core.addColorStop(.5, 'rgba(255,190,115,.25)'); core.addColorStop(1, 'rgba(255,190,115,0)');
  circlePath(c, 0, 0, r * .45); c.fillStyle = core; c.fill();
}

/* ---------- 음영(고정 조명) ---------- */
function stdShade(c, r, k, pr) {
  k = k || 1; pr = pr || r;
  var g = c.createRadialGradient(-pr * .38, -pr * .42, pr * .05, 0, 0, pr * 1.02);
  g.addColorStop(0, 'rgba(255,255,255,' + (.22 * k) + ')');
  g.addColorStop(.45, 'rgba(255,255,255,0)');
  g.addColorStop(.8, 'rgba(0,0,10,' + (.12 * k) + ')');
  g.addColorStop(1, 'rgba(0,0,15,' + (.45 * k) + ')');
  circlePath(c, 0, 0, pr); c.fillStyle = g; c.fill();
  circlePath(c, 0, 0, pr - .6); c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 1.2; c.stroke();
}

/* ---------- 11개 천체 (실제 크기 순서, 크기는 수박게임 방식) ---------- */
var BODIES = [
  { name: '달',     r: 14,  color: '#d0d0d4', draw: drawMoon },

  { name: '해왕성', r: 49,  color: '#3a63e8', draw: drawNeptune },

var LAST = BODIES.length - 1;
var DROP_WEIGHTS = [30, 30, 20, 12, 8];   // 달~지구 중에서 떨어짐

function makeSprite(def) {
  var r = def.r, S = Math.ceil(2 * r * SS);
  function mk() {
    var cv = document.createElement('canvas'); cv.width = cv.height = S;
    var cx = cv.getContext('2d'); cx.scale(S / (2 * r), S / (2 * r)); cx.translate(r, r);
    return { cv: cv, cx: cx };
  }
  var a = mk();
  a.cx.save(); circlePath(a.cx, 0, 0, r - .3); a.cx.clip(); def.draw(a.cx, r); a.cx.restore();
  var s = mk();

  return { art: a.cv, shade: s.cv };
}
var sprites = BODIES.map(makeSprite);

(function buildLegend() {

function makeBg() {
  bgCanvas.width = canvas.width; bgCanvas.height = canvas.height;
  var b = bgCanvas.getContext('2d'); b.setTransform(sx, 0, 0, sy, 0, 0);
  var g = b.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0c1030'); g.addColorStop(1, '#050614');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  var R = rng(5), i;
  var neb = [[90, 220, 140, 'rgba(110,70,200,.12)'], [320, 420, 170, 'rgba(60,110,220,.10)'], [200, 540, 130, 'rgba(180,70,150,.07)']];
  for (i = 0; i < neb.length; i++) {
    var n = neb[i], rg = b.createRadialGradient(n[0], n[1], 0, n[0], n[1], n[2]);
    rg.addColorStop(0, n[3]); rg.addColorStop(1, 'rgba(0,0,0,0)');

  }
  for (i = 0; i < 110; i++) {
    b.fillStyle = 'rgba(255,255,255,' + (.15 + R() * .55) + ')';

  }
}
function fit() {
  var stage = document.getElementById('stage');
  var aw = stage.clientWidth - 16, ah = stage.clientHeight;
  if (aw <= 0 || ah <= 0) return;
  var s = Math.min(aw / W, ah / H);
  var cssW = Math.max(120, Math.floor(W * s)), cssH = Math.max(180, Math.floor(H * s));
  var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';

/* ---------- 물리 세계 ---------- */
var engine = Engine.create({ positionIterations: 8, velocityIterations: 6 });
engine.gravity.y = 1.5;
var world = engine.world;
var wallOpt = { isStatic: true, friction: .1, restitution: .1, label: 'wall' };
Composite.add(world, [
  Bodies.rectangle(-30, H / 2 - 600, 60, H * 3, wallOpt),
  Bodies.rectangle(W + 30, H / 2 - 600, 60, H * 3, wallOpt),
  Bodies.rectangle(W / 2, H + 30, W + 200, 60, wallOpt)
]);

/* ---------- 게임 상태 ---------- */
var simTime = 0, score = 0, best = 0, state = 'play', overT = 0;
var cur = 0, nxt = 0, dropX = W / 2, canDrop = true, nextDropAt = 0, pressed = false;
var mergeQueue = [], particles = [], rings = [];
var uiOpen = 0, sentMax = 0, sendTimer = 0, lastSend = 0;   // 창이 열려 있으면 게임이 멈춘다 / 서버로 보낸 최고 점수
elBest.textContent = best;

function randDrop() {
  var tot = 0, i; for (i = 0; i < DROP_WEIGHTS.length; i++) tot += DROP_WEIGHTS[i];
  var v = Math.random() * tot;
  for (i = 0; i < DROP_WEIGHTS.length; i++) { v -= DROP_WEIGHTS[i]; if (v < 0) return i; }
  return 0;
}
// 단체 최고 점수는 서버 값(best)과 내 현재 점수 중 큰 값을 보여 준다
function showBest() { var v = Math.max(best, score); elBest.textContent = v; }
function setBest(v) { best = Number(v) || 0; showBest(); }
function setScore(v) { score = v; elScore.textContent = v; showBest(); maybeSend(false); }
function sendScore() {
  lastSend = Date.now(); sendTimer = 0;
  if (score <= sentMax) return;
  var s = score;
  try {
    fetch('/api/score', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ score: s }) })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (j && typeof j.best === 'number') { sentMax = Math.max(sentMax, s); setBest(j.best); } })
      .then(null, function () {});
  } catch (e) {}
}
// 점수가 오르면 서버로 보낸다 (너무 자주 보내지 않도록 1.5초에 한 번, 마지막 값은 반드시 보낸다)
function maybeSend(force) {
  if (score <= sentMax) return;
  if (force) { if (sendTimer) { clearTimeout(sendTimer); sendTimer = 0; } sendScore(); return; }
  if (sendTimer) return;
  var wait = Math.max(0, 1500 - (Date.now() - lastSend));
  sendTimer = setTimeout(sendScore, wait);
}
function setNext() { drawIcon(nextCv, nxt, false); }
function clampX(x, level) { var r = BODIES[level].r; return Math.max(r, Math.min(W - r, x)); }

function spawn(level, x, y, vx, vy) {
  var def = BODIES[level];
  var b = Bodies.circle(x, y, def.r, { restitution: .2, friction: .15, frictionStatic: .4, frictionAir: 0, slop: .02, label: 'planet' });
  Body.setMass(b, 1);
  b.level = level; b.born = simTime; b.alive = true;
  if (vx || vy) Body.setVelocity(b, { x: vx || 0, y: vy || 0 });
  Composite.add(world, b);
  return b;
}
function planets() {
  var all = Composite.allBodies(world), out = [];
  for (var i = 0; i < all.length; i++) if (all[i].label === 'planet') out.push(all[i]);
  return out;
}

function onPairs(e) {
  var p = e.pairs;
  for (var i = 0; i < p.length; i++) {
    var a = p[i].bodyA, b = p[i].bodyB;
    if (a.label === 'planet' && b.label === 'planet' && a.level === b.level && a.alive && b.alive && !a.merging && !b.merging) {
      a.merging = b.merging = true;
      mergeQueue.push([a, b]);
    }
  }
}
Events.on(engine, 'collisionStart', onPairs);
Events.on(engine, 'collisionActive', onPairs);

function burst(x, y, color, n, speed) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * TWO_PI, v = (.3 + Math.random()) * speed;
    particles.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, color: color, s: 1.2 + Math.random() * 2 });
  }
}
function processMerges() {
  for (var i = 0; i < mergeQueue.length; i++) {
    var a = mergeQueue[i][0], b = mergeQueue[i][1];
    if (!a.alive || !b.alive) continue;
    a.alive = b.alive = false;
    var lvl = a.level;
    var mx = (a.position.x + b.position.x) / 2, my = (a.position.y + b.position.y) / 2;
    var vx = (a.velocity.x + b.velocity.x) / 2, vy = (a.velocity.y + b.velocity.y) / 2;
    var born = Math.min(a.born, b.born);
    Composite.remove(world, a); Composite.remove(world, b);
    setScore(score + (lvl + 1) * (lvl + 2) / 2);   // 수박게임과 같은 점수 체계
    if (lvl === LAST) {                              // 은하 둘이 만나면 사라짐
      burst(mx, my, BODIES[LAST].color, 46, 6);
      rings.push({ x: mx, y: my, r: BODIES[LAST].r, t: 0, color: BODIES[LAST].color, big: true });
    } else {
      var nl = lvl + 1, nr = BODIES[nl].r;
      var nb = spawn(nl, Math.max(nr, Math.min(W - nr, mx)), my, vx * .5, vy * .5);
      nb.born = born; nb.pop = simTime;
      burst(mx, my, BODIES[nl].color, 10 + nl * 2, 3 + nl * .3);
      rings.push({ x: mx, y: my, r: nr, t: 0, color: BODIES[nl].color, big: false });
    }
  }
  mergeQueue.length = 0;
}

function tryDrop() {
  if (state !== 'play' || uiOpen || !canDrop || simTime < nextDropAt) return false;
  spawn(cur, clampX(dropX, cur), DROP_Y, 0, 0);
  cur = nxt; nxt = randDrop(); setNext();
  canDrop = false; nextDropAt = simTime + 520;
  return true;
}
function endGame() {
  state = 'over';
  maybeSend(true);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalBest').textContent = Math.max(best, score);
  elOver.classList.remove('hidden');
}
function checkOver() {
  var over = false, ps = planets();
  for (var i = 0; i < ps.length; i++) {
    var b = ps[i];
    if (simTime - b.born > 1000 && b.position.y - BODIES[b.level].r < LINE_Y) { over = true; break; }
  }
  if (over) overT += STEP; else overT = Math.max(0, overT - STEP * 2);
  if (overT > 2000) endGame();
}
function stepSim() {
  simTime += STEP;
  Engine.update(engine, 16.666);
  processMerges();
  checkOver();
  if (!canDrop && simTime >= nextDropAt) canDrop = true;
  var i, p;
  for (i = particles.length - 1; i >= 0; i--) {
    p = particles[i]; p.x += p.vx; p.y += p.vy; p.vx *= .96; p.vy *= .96; p.life -= .035;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (i = rings.length - 1; i >= 0; i--) { rings[i].t += .06; if (rings[i].t >= 1) rings.splice(i, 1); }
}
function reset() {
  var ps = planets(); for (var i = 0; i < ps.length; i++) { ps[i].alive = false; Composite.remove(world, ps[i]); }
  mergeQueue.length = 0; particles.length = 0; rings.length = 0;
  setScore(0); overT = 0; state = 'play'; simTime = 0; canDrop = true; nextDropAt = 0;
  cur = randDrop(); nxt = randDrop(); setNext();
  elOver.classList.add('hidden');
}

/* ---------- 그리기 ---------- */
function easeOutBack(k) { var c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); }
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bgCanvas, 0, 0);
  ctx.setTransform(sx, 0, 0, sy, 0, 0);

  // 판 테두리
  ctx.strokeStyle = 'rgba(150,170,255,.45)'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(1.5, 70); ctx.lineTo(1.5, H - 1.5); ctx.lineTo(W - 1.5, H - 1.5); ctx.lineTo(W - 1.5, 70); ctx.stroke();

  // 게임오버 판정선
  var warn = overT > 0, pulse = warn ? (.55 + .45 * Math.sin(simTime / 90)) : 1;
  ctx.setLineDash([8, 8]); ctx.lineWidth = 2;
  ctx.strokeStyle = warn ? 'rgba(255,90,90,' + pulse + ')' : 'rgba(255,255,255,.28)';
  ctx.beginPath(); ctx.moveTo(4, LINE_Y); ctx.lineTo(W - 4, LINE_Y); ctx.stroke(); ctx.setLineDash([]);

  // 안내선과 들고 있는 천체
  if (state === 'play' && canDrop) {
    var gx = clampX(dropX, cur);
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2; ctx.setLineDash([4, 8]);
    ctx.beginPath(); ctx.moveTo(gx, DROP_Y + BODIES[cur].r); ctx.lineTo(gx, H - 2); ctx.stroke(); ctx.setLineDash([]);
    var d = BODIES[cur], sp = sprites[cur];
    ctx.drawImage(sp.art, gx - d.r, DROP_Y - d.r, d.r * 2, d.r * 2);
    ctx.drawImage(sp.shade, gx - d.r, DROP_Y - d.r, d.r * 2, d.r * 2);
  }

  // 천체들
  var ps = planets();
  for (var i = 0; i < ps.length; i++) {
    var b = ps[i], def = BODIES[b.level], r = def.r, spr = sprites[b.level], s = 1;
    if (b.pop !== undefined) { var k = (simTime - b.pop) / 220; if (k < 1) s = .55 + .45 * easeOutBack(k); }
    ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.scale(s, s);
    ctx.save(); ctx.rotate(b.angle); ctx.drawImage(spr.art, -r, -r, r * 2, r * 2); ctx.restore();
    ctx.drawImage(spr.shade, -r, -r, r * 2, r * 2);
    ctx.restore();
  }

  // 합체 효과
  for (i = 0; i < rings.length; i++) {
    var rg = rings[i];
    ctx.globalAlpha = (1 - rg.t) * (rg.big ? .9 : .6); ctx.strokeStyle = rg.color; ctx.lineWidth = rg.big ? 4 : 2.5;
    ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r * (1 + rg.t * (rg.big ? 1.2 : .45)), 0, TWO_PI); ctx.stroke();
  }
  for (i = 0; i < particles.length; i++) {
    var p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, TWO_PI); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---------- 입력 (터치/마우스/키보드) ---------- */
function toX(e) { var rc = canvas.getBoundingClientRect(); return (e.clientX - rc.left) / rc.width * W; }
canvas.addEventListener('pointerdown', function (e) {
  e.preventDefault(); pressed = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  dropX = toX(e);
});
canvas.addEventListener('pointermove', function (e) {
  if (pressed || e.pointerType === 'mouse') dropX = toX(e);
});
function endPress(e) {
  if (!pressed) return;
  pressed = false; dropX = toX(e);
  if (e.type === 'pointerup') tryDrop();
}
canvas.addEventListener('pointerup', endPress);
canvas.addEventListener('pointercancel', endPress);
window.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowLeft') dropX -= 14;
  else if (e.key === 'ArrowRight') dropX += 14;
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (state === 'over') reset(); else tryDrop(); }
});
document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.getElementById('restart').addEventListener('click', reset);

/* ---------- 창(역대 기록 / 확인) ---------- */
var elDlg = document.getElementById('dlg'), elDlgCard = document.getElementById('dlgCard');
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function openDlg() { if (!uiOpen) { uiOpen = 1; pressed = false; } elDlg.classList.remove('hidden'); }
function closeDlg() { uiOpen = 0; elDlg.classList.add('hidden'); elDlgCard.textContent = ''; last = 0; }
function confirmDlg(title, msg, okLabel, onOk) {
  elDlgCard.textContent = '';
  elDlgCard.appendChild(el('h2', '', title));
  elDlgCard.appendChild(el('p', 'sm', msg));
  var row = el('div', 'row');
  var no = el('button', 'sec', '취소'); no.type = 'button'; no.addEventListener('click', closeDlg);
  var ok = el('button', '', okLabel); ok.type = 'button'; ok.addEventListener('click', function () { closeDlg(); onOk(); });
  row.appendChild(no); row.appendChild(ok); elDlgCard.appendChild(row);
  openDlg();
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function fmtAt(ts) { var d = new Date(ts); return pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function hallDlg() {
  elDlgCard.textContent = '';
  elDlgCard.appendChild(el('h2', '', '역대 최고기록'));
  var body = el('div', 'empty', '불러오는 중…'); elDlgCard.appendChild(body);
  var row = el('div', 'row'); var close = el('button', '', '닫기'); close.type = 'button'; close.addEventListener('click', closeDlg);
  row.appendChild(close); elDlgCard.appendChild(row);
  openDlg();
  fetch('/api/hall', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); }).then(function (j) {
    if (!uiOpen || !elDlgCard.contains(body)) return;
    var list = (j && j.entries) || [];
    if (!list.length) { body.textContent = '아직 기록이 없습니다.'; return; }
    var ol = el('ol');
    list.forEach(function (e, i) {
      var li = el('li', e.live ? 'live' : '');
      li.appendChild(el('span', 'rk', String(i + 1)));
      var nm = el('span', 'nm', e.name); nm.appendChild(el('small', '', e.live ? '진행 중' : fmtAt(e.at)));
      li.appendChild(nm); li.appendChild(el('span', 'pt', String(e.score))); ol.appendChild(li);
    });
    body.replaceWith(ol);
  }).then(null, function () { if (elDlgCard.contains(body)) body.textContent = '기록을 불러오지 못했습니다.'; });
}
document.getElementById('btnHall').addEventListener('click', hallDlg);
document.getElementById('btnHome').addEventListener('click', function () {
  function go() { location.href = '/play' + location.search; }
  if (state === 'play' && score > 0) confirmDlg('처음으로', '처음 화면으로 돌아갑니다. 진행 중인 게임은 사라집니다.', '돌아가기', go); else go();
});
document.getElementById('btnRefresh').addEventListener('click', function () {
  if (state === 'play' && score > 0) confirmDlg('다시 시작', '지금 게임을 끝내고 처음부터 다시 시작합니다.', '다시 시작', reset); else reset();
});

/* ---------- 메인 루프 (주사율과 무관하게 60Hz 고정 시뮬레이션) ---------- */
var last = 0, acc = 0, running = false, loopToken = 0;
function tick(t) {
  if (!last) last = t;
  var dt = Math.min(100, t - last); last = t;
  if (state === 'play' && !document.hidden && !uiOpen) {
    acc += dt; var n = 0;
    while (acc >= STEP && n < 5) { stepSim(); acc -= STEP; n++; }
    if (n === 5) acc = 0;
  }
  render();
}
// 게임은 운영 중일 때 입구 스크립트가 start()를 부를 때만 돌고, 종료되면 stop()으로 멈춘다
function start() {
  if (running) return;
  running = true; reset(); last = 0; acc = 0; fit();
  var token = ++loopToken;
  function f(t) { if (!running || token !== loopToken) return; requestAnimationFrame(f); tick(t); }
  requestAnimationFrame(f);
}
function stop() {
  if (!running) return;
  running = false; pressed = false; reset(); elOver.classList.add('hidden'); closeDlg();
}
window.__game = { start: start, stop: stop, isRunning: function () { return running; },
  setInfo: function (o) {
    if (!o) return;
    if (typeof o.group === 'string') document.getElementById('org').textContent = o.group;
    if (typeof o.best === 'number') { best = o.best; showBest(); }
  } };

window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function () { setTimeout(fit, 200); });
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.getElementById('stage'));

/* 개발·검증용 훅 (주소에 ?dev=1 이 있을 때만) */
if (/[?&]dev=1/.test(location.search)) window.__spaceMerge = {
  BODIES: BODIES, sprites: sprites,
  step: function (n) { for (var i = 0; i < (n || 1); i++) stepSim(); },
  spawn: spawn, planets: planets, reset: reset,
  dropAt: function (x) { dropX = x; canDrop = true; nextDropAt = 0; return tryDrop(); },
  info: function () {
    var ps = planets(), bad = false, maxL = 0;
    ps.forEach(function (b) { if (!isFinite(b.position.x) || !isFinite(b.position.y)) bad = true; if (b.level > maxL) maxL = b.level; });
    return { count: ps.length, score: score, state: state, maxLevel: maxL, nan: bad, simTime: simTime };
  }
};
})();
</script>
